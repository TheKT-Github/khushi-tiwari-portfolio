<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="afBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1024" />
      <stop offset="100%" stop-color="#141E3A" />
    </linearGradient>
    <linearGradient id="flowAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#afBg)" />

  <!-- Top bar -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="#11182D" stroke="rgba(255,255,255,0.08)" />
  <circle cx="65" cy="52" r="5" fill="#EF4444" />
  <circle cx="85" cy="52" r="5" fill="#F59E0B" />
  <circle cx="105" cy="52" r="5" fill="#10B981" />
  <text x="400" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">AttendFlow — Leave Management &amp; Escalation Engine</text>

  <!-- Left Side: Interactive Leave Request Form UI -->
  <rect x="40" y="95" width="330" height="320" rx="10" fill="#101730" stroke="rgba(59, 130, 246, 0.3)" />
  <text x="65" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Submit Leave Request</text>
  <text x="65" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">React Frontend + Flask REST API Validation</text>

  <rect x="65" y="175" width="280" height="38" rx="6" fill="#182142" stroke="rgba(255,255,255,0.08)" />
  <text x="80" y="198" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Leave Type: Annual / Privilege</text>

  <rect x="65" y="225" width="280" height="38" rx="6" fill="#182142" stroke="rgba(255,255,255,0.08)" />
  <text x="80" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Duration: 3 Days (Auto-calculated)</text>

  <rect x="65" y="275" width="280" height="50" rx="6" fill="#182142" stroke="rgba(255,255,255,0.08)" />
  <text x="80" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#64748B">Reason for Leave with Attachment</text>

  <rect x="65" y="345" width="280" height="42" rx="6" fill="url(#flowAccent)" />
  <text x="205" y="371" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#080B16" text-anchor="middle">Submit for Multi-Tier Approval</text>

  <!-- Right Side: Workflow Progression Tracker -->
  <rect x="390" y="95" width="370" height="320" rx="10" fill="#101730" stroke="rgba(255,255,255,0.08)" />
  <text x="415" y="132" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Workflow Escalation Tracker</text>
  <text x="415" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Automated Routing &amp; Status Transitions</text>

  <!-- Step 1: Requested -->
  <circle cx="435" cy="195" r="14" fill="#10B981" />
  <path d="M430 195 L434 199 L442 191" stroke="#FFFFFF" stroke-width="2" fill="none" />
  <line x1="435" y1="209" x2="435" y2="245" stroke="#10B981" stroke-width="2" />
  <text x="460" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Leave Request Initiated</text>
  <text x="460" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#10B981">Verified &amp; Logged via Flask API</text>

  <!-- Step 2: Manager Review -->
  <circle cx="435" cy="260" r="14" fill="#3B82F6" />
  <circle cx="435" cy="260" r="5" fill="#FFFFFF" />
  <line x1="435" y1="274" x2="435" y2="310" stroke="#3B82F6" stroke-width="2" />
  <text x="460" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Manager Review</text>
  <text x="460" y="275" font-family="system-ui, sans-serif" font-size="10" fill="#3B82F6">Escalation countdown: 24h timer</text>

  <!-- Step 3: Escalation/HR Final Approval -->
  <circle cx="435" cy="325" r="14" fill="#8B5CF6" />
  <circle cx="435" cy="325" r="5" fill="#FFFFFF" />
  <text x="460" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC">Escalation &amp; HR Notification</text>
  <text x="460" y="340" font-family="system-ui, sans-serif" font-size="10" fill="#8B5CF6">Automated SLA escalation active</text>

  <rect x="415" y="365" width="320" height="32" rx="6" fill="#182142" />
  <text x="430" y="385" font-family="system-ui, sans-serif" font-size="11" fill="#22D3EE">✓ End-to-end audit logging &amp; state synchronization</text>
</svg>
