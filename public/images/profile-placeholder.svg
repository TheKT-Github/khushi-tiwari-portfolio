<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101528" />
      <stop offset="50%" stop-color="#151b36" />
      <stop offset="100%" stop-color="#0b0e1d" />
    </linearGradient>
    <linearGradient id="avatarAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.4)" />
      <stop offset="100%" stop-color="rgba(59, 130, 246, 0.1)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="24" />

  <!-- Subtle glow ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#glowGlow)" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Minimal Tech Avatar Figure -->
  <g fill="none" stroke="url(#avatarAccent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Head -->
    <circle cx="100" cy="74" r="32" fill="#151B36" stroke="url(#avatarAccent)" stroke-width="2.5" />
    <!-- Monogram Inside Head -->
    <text x="100" y="82" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle" letter-spacing="1" stroke="none">KT</text>
    <!-- Shoulders / Torso -->
    <path d="M46 168 C46 130, 70 120, 100 120 C130 120, 154 130, 154 168" fill="#151B36" stroke="url(#avatarAccent)" stroke-width="2.5" />
    <!-- Collar accent -->
    <path d="M84 120 L100 138 L116 120" stroke="url(#avatarAccent)" stroke-width="2" />
  </g>

  <!-- Status / active badge dot -->
  <circle cx="152" cy="152" r="8" fill="#22D3EE" stroke="#080B16" stroke-width="2" />
</svg>
